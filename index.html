<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <style>
        body {
            background-color: #121216;
            margin: 0;
            padding: 12px;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .news-card {
            background: rgba(25, 25, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .news-date {
            font-size: 11px;
            color: #34D399;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .news-text {
            font-size: 13px;
            color: #d1d5db;
            line-height: 1.5;
            word-break: break-word;
        }
        .news-text a {
            color: #60a5fa;
            text-decoration: none;
        }
    </style>
</head>

</html>
