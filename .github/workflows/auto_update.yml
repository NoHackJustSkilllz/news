name: Auto Update News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run script
        run: python update.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@ci.local"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Telegram posts" && git push)
